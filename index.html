<style>
:root{
  --bg:#f5f6fa;--bg2:#fff;--bg3:#eef0f7;--fg:#1a1d2e;--fg2:#5a607a;--fg3:#9399b0;
  --accent:#2563eb;--accent2:#1d4ed8;--good:#16a34a;--warn:#d97706;--bad:#dc2626;
  --border:#dde1f0;--shadow:0 2px 12px rgba(37,99,235,.08);
  --card:0 1px 4px rgba(0,0,0,.06);--radius:10px;--font:'Inter',sans-serif;
  --head:'Rajdhani',sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--bg2:#1a1d2e;--bg3:#232740;--fg:#e8eaf6;--fg2:#9399b0;--fg3:#5a607a;
  --accent:#3b82f6;--accent2:#2563eb;--good:#22c55e;--warn:#f59e0b;--bad:#f87171;
  --border:#2d3158;--shadow:0 2px 12px rgba(0,0,0,.3);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1117;--bg2:#1a1d2e;--bg3:#232740;--fg:#e8eaf6;--fg2:#9399b0;--fg3:#5a607a;
  --accent:#3b82f6;--accent2:#2563eb;--good:#22c55e;--warn:#f59e0b;--bad:#f87171;
  --border:#2d3158;--shadow:0 2px 12px rgba(0,0,0,.3);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:.3px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);font-size:13px}
input,select,textarea{font-family:var(--font);font-size:13px;color:var(--fg);background:var(--bg2);border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select option{background:var(--bg2)}
label{font-size:12px;font-weight:500;color:var(--fg2);display:block;margin-bottom:3px}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:var(--bg2);border-right:1.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* Sidebar */
.sb-logo{padding:18px 16px 12px;border-bottom:1.5px solid var(--border)}
.sb-logo h2{font-family:var(--head);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:1px}
.sb-logo p{font-size:11px;color:var(--fg3);margin-top:1px}
.sb-user{padding:12px 16px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:8px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600}
.sb-urole{font-size:11px;color:var(--fg3);background:var(--bg3);padding:1px 6px;border-radius:10px;display:inline-block;margin-top:1px}
.sb-nav{flex:1;padding:8px 0}
.nav-section{font-size:10px;font-weight:600;color:var(--fg3);letter-spacing:1px;padding:10px 16px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:0;font-size:13px;font-weight:500;color:var(--fg2);transition:all .12s;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--fg)}

#topbar{padding:14px 24px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0}
#topbar h3{font-family:var(--head);font-size:20px;font-weight:600;flex:1}
.tbar-actions{display:flex;gap:8px;align-items:center}

/* Cards */
.card{background:var(--bg2);border-radius:var(--radius);border:1.5px solid var(--border);box-shadow:var(--card);padding:20px;margin-bottom:16px}
.card-title{font-family:var(--head);font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--fg)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--bg2);border-radius:var(--radius);border:1.5px solid var(--border);padding:16px;text-align:center}
.stat-num{font-family:var(--head);font-size:28px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:12px;color:var(--fg3);margin-top:2px;font-weight:500}
.stat-sub{font-size:11px;color:var(--fg3);margin-top:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:none;font-weight:500;font-size:13px;transition:all .12s;cursor:pointer}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
.btn-s{background:var(--bg3);color:var(--fg)}.btn-s:hover{background:var(--border)}
.btn-g{background:#dcfce7;color:#166534}.btn-g:hover{background:#bbf7d0}

.dr{background:none;border:none;color:var(--bad);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px}
.dr:hover{background:var(--bg3)}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1.5px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-draft{background:#f3f4f6;color:#6b7280}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-active{background:#dcfce7;color:#166534}
.badge-submitted{background:#dbeafe;color:#1e40af}
.badge-invoiced{background:#ede9fe;color:#5b21b6}
.badge-accepted{background:#d1fae5;color:#065f46}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-paid{background:#d1fae5;color:#065f46}
.badge-partial{background:#fef3c7;color:#92400e}
.badge-overdue{background:#fee2e2;color:#991b1b}
.badge-cancelled{background:#f3f4f6;color:#6b7280}
.badge-filed{background:#d1fae5;color:#065f46}
.badge-unfiled{background:#fee2e2;color:#991b1b}
.badge-open{background:#dbeafe;color:#1e40af}
.badge-closed{background:#e0e7ff;color:#4338ca}
.badge-checkedin{background:#dcfce7;color:#166534}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column}
.form-group.span2{grid-column:span 2}
.form-group.span3{grid-column:span 3}
.form-group.full{grid-column:1/-1}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border-radius:12px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.pin-row{display:flex;gap:8px;margin:8px 0 16px}
.pin-row input{letter-spacing:4px;font-size:18px;text-align:center}

/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert-s{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert-e{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}

.alert-i{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}

/* Steps / workflow indicator */
.workflow{display:flex;align-items:center;gap:0;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.wf-step{display:flex;align-items:center;gap:0}

.wf-node.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.wf-arrow{color:var(--fg3);padding:0 4px;font-size:12px}

/* File upload */
.file-drop{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;color:var(--fg3);font-size:12px;transition:border-color .15s}
.file-drop:hover{border-color:var(--accent)}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;margin:3px}

/* GPS */
.gps-box{background:var(--bg3);border-radius:8px;padding:12px;font-size:12px;color:var(--fg2)}
.gps-coords{font-family:monospace;font-size:13px;color:var(--good);font-weight:600;margin-top:4px}

/* Payment progress */
.pay-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0}
.pay-fill{height:100%;background:var(--good);border-radius:4px;transition:width .3s}

/* Misc */
.sep{height:1px;background:var(--border);margin:16px 0}
.txt-good{color:var(--good)}.txt-bad{color:var(--bad)}.txt-warn{color:var(--warn)}.txt-fg2{color:var(--fg2)}.txt-err{color:var(--bad)}.txt-info{color:var(--accent)}
/* Pipeline strip */
.pipeline-strip{display:flex;align-items:center;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;overflow-x:auto;gap:0}
.pipe-stage{display:flex;flex-direction:column;align-items:center;min-width:80px;flex:1;padding:4px 2px}

.pipe-lbl{font-size:10px;color:var(--fg2);text-align:center;letter-spacing:.3px;white-space:nowrap}
.pipe-arrow{font-size:20px;color:var(--fg3);padding:0 2px;align-self:center;flex-shrink:0}
.pipe-err{color:var(--bad)}.pipe-warn{color:var(--warn)}.pipe-good{color:var(--good)}.pipe-info{color:var(--accent)}
.bold{font-weight:600}.mono{font-family:monospace}
.empty-state{text-align:center;padding:48px 24px;color:var(--fg3)}
.empty-state .ei{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.text-right{text-align:right}.text-center{text-align:center}
.w-100{width:100%}
@media(max-width:700px){

<script>

// ===== NETLIFY CLOUD SYNC (Netlify Functions + Blobs) =====
const API='/api/db';
let CLOUD=false, _ver=0, _lastSynced='', _saveChain=Promise.resolve();
const ARR_KEYS=['users','purchaseOrders','contracts','visits','reports','quotations','invoices','challans','payments','gstFilings'];
function normDB(db){
  db=db||{};
  ARR_KEYS.forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  if(!db.settings) db.settings={};
  return db;
}
function cloudSave(json){
  _saveChain=_saveChain.then(()=>fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({baseVersion:_ver,data:JSON.parse(json)})})
    .then(async r=>{
      const res=await r.json().catch(()=>({}));
      if(r.status===409 && res.data){
        // someone else saved first: load their version
        _ver=res.version; const j=JSON.stringify(normDB(res.data)); _lastSynced=j;
        try{localStorage.setItem(KEY,j);}catch(e){}
        alert('⚠️ Another user saved changes at the same time. The latest data has been loaded — please repeat your last change.');
        CM(); if(CU) renderPage();
        return;
      }
      if(!r.ok) throw new Error(res.error||('HTTP '+r.status));
      _ver=res.version;
    })
    .catch(e=>alert('⚠️ Cloud save failed: '+e.message+'\nCheck your internet connection and try again.')));
}
async function cloudPull(){
  try{
    const r=await fetch(API+'?v='+_ver,{cache:'no-store'});
    if(!r.ok) return;
    const res=await r.json();
    if(res.unchanged || !res.data) return;
    _ver=res.version;
    const json=JSON.stringify(normDB(res.data));
    if(json===_lastSynced) return;
    _lastSynced=json;
    try{localStorage.setItem(KEY,json);}catch(e){}
    if(CU && !_ov && CPage!=='settings' && CPage!=='checkin') renderPage();
  }catch(e){}
}

// ===== CONSTANTS =====
const KEY='savtech_v3';
const ROLES={admin:'Admin',site_incharge:'Site Incharge',engineer:'Engineer',finance:'Finance'};
const ROLE_PINS={admin:'1234',site_incharge:'2345',engineer:'3456',finance:'4567'};
const CUSTS=['IOCL','BPCL','HPCL'];
const MAKE_OPTS=['Rotork','Auma','Rycon','Biffi','Limitorque','Others'];
const ATYPE_OPTS=['EH ROSOV','PNEUMATIC ROSOV','MOV','DBBV','CONTROL VALVE','OTHERS'];
const ATYPE_MODELS={'EH ROSOV':['SI 2.1 Q61-163-51-20AFGH-SP','SI2.1-Q70-173-51-20AFGH-SP','SI1.1-Q51-163-51-20AFGH-SP','SI2.1-Q51-163-5120AFGH-SP','SI2.1-Q80-013-51-20AFGH-SP'],'PNEUMATIC ROSOV':['GP-085C-435A/C3','CP/S-065-280A/BA','CP/S-065-385A/EA','GP-130C-685A/C2','CP/S-055-200A/BA'],'DBBV':['AUMA'],'CONTROL VALVE':[],'MOV':[],'OTHERS':[]};
const PLINE_OPTS=['INLET','OUTLET','RECIRCULATION','INLET/OUTLET','OTHERS'];
const TRAVEL_MODES=['Car','Train','Flight','Bus','Other'];
const HEALTH_OPTS=['Good','Fair','Poor','Critical'];
const PO_STATUS=['Open','Partial','Closed','Cancelled'];
const PAY_MODES=['NEFT','RTGS','Cheque','UPI','DD','Cash'];
const GSTR_TYPES=['GSTR-1','GSTR-3B','GSTR-9'];
const SPARES_BY_TYPE={
  'PNEUMATIC ROSOV':['AFR','AUTO RESET SOV','MANUAL RESET SOV','LIMIT SWITCH','SEAL KIT'],
  'EH ROSOV':['Complete Seal Kit','IP67 Seal Kit','Solenoid Coil','Solenoid Plunger','Limit Switch Set','Micro Switches NO NC','Potentiometer','DC Convertor SMPS 3Phase 24vdc','Main PCB Card','Power Card','Terminal Bung','Loop Loom','Fuse','Hydraulic Seal Kit','UV Glass Screen Fiber','Local Remote PCB','Selector Switch','Motor 24vdc'],
  'MOV':['Main PCB Card K Series','Power Module K Series','Contactor Assembly K Series','Loop Loom K Series','Syncropak Assembly K Series','Limit Switch Mechanism K Series','Mechanical Spares Kit K30','Mechanical Spares Kit K60','Mechanical Spares Kit K150','Mechanical Spares Kit K300','Mechanical Spares Kit K600','Mechanical Spares Kit K1000','Main PCB Card IQ','Power Card IQ'],
};
const SUBJECT_OPTS=['AMC of EH ROSOV','AMC of PNEUMATIC ROSOV','AMC of MOV','AMC of DBBV','CAMC of EH ROSOV','CAMC of PNEUMATIC ROSOV','CAMC of ROSOV','CAMC of MOV','CAMC of DBBV','Others'];
// Generate tank numbers: 1-100, then 1A-100A, 1B-100B ... 1Z-100Z
const TANK_OPTS=(()=>{const a=[];for(let i=1;i<=100;i++)a.push(String(i));for(let c=65;c<=90;c++)for(let i=1;i<=100;i++)a.push(i+String.fromCharCode(c));return a;})();
const TANK_DL_HTML=TANK_OPTS.map(t=>`<option value="${t}">`).join('');

// ===== DB =====
const DEFAULT_SETTINGS={company:'Savtech Solutions',gst:18,
  address:'MCF 190, Agwanpur, Sector 91, Faridabad - 121013, Haryana',
  phone:'9717837712',contactName:'Rohit Singh',
  email:'savtechsolutions@gmail.com',email2:'contact@savtech.in',
  gstin:'06AQTPK4656M1Z2',officePhone:'09811607790, 08851096668',
  bankName:'',bankAcc:'',bankIFSC:'',pan:''};

function rDB(){

  _ov=document.createElement('div');_ov.className='ov';

}

// ===== SELECT-OR-OTHER HELPERS =====
function soChg(id){
  const sel=document.getElementById(id);const oth=document.getElementById(id+'-oth');
  if(sel&&oth)oth.style.display=sel.value==='Others'?'block':'none';
}
function soVal(id){
  const sel=document.getElementById(id);if(!sel)return'';
  return sel.value==='Others'?(document.getElementById(id+'-oth')?.value.trim()||'Others'):sel.value;
}
function soSet(id,val,opts){
  // set a select-or-other control to a value; if val not in opts, sets to Others
  const sel=document.getElementById(id);const oth=document.getElementById(id+'-oth');
  if(!sel)return;
  if(opts.includes(val)){sel.value=val;if(oth)oth.style.display='none';}
  else if(val){sel.value='Others';if(oth){oth.style.display='block';oth.value=val;}}
}

// ===== HPCL CONTRACT HELPERS =====
function getHPCLContract(){return rDB().contracts.find(c=>c.contractNo==='5300052389');}
function hpclNextDue(depotLine,visits){
  const done=visits.filter(v=>v.customer==='HPCL'&&v.depotLine===depotLine&&v.status==='Completed');
  if(!done.length)return'2026-09-11';
  done.sort((a,b)=>b.visitDate.localeCompare(a.visitDate));
  const d=new Date(done[0].visitDate);d.setMonth(d.getMonth()+6);
  return d.toISOString().slice(0,10);
}
function hpclVisitsDone(depotLine,visits){
  return visits.filter(v=>v.customer==='HPCL'&&v.depotLine===depotLine&&v.status==='Completed').length;
}

// ===== DASHBOARD =====
function _visitStage(v,db){
  if(v.status==='Cancelled')return'cancelled';
  if(!v.engineerId)return'unassigned';
  const hasReport=db.reports.find(r=>r.visitId===v.id);
  if(v.status==='Completed'){
    if(!hasReport)return'report_pending';
    const rpt=hasReport;
    const spares=rpt.site&&rpt.site.requiredSpares&&rpt.site.requiredSpares.filter(s=>s.name).length>0;
    const hasQuote=db.quotations.find(q=>q.reportId===rpt.id||q.visitId===v.id);
    if(spares&&!hasQuote)return'quotation_needed';
    const hasInv=db.invoices.find(i=>i.visitId===v.id||i.reportId===rpt.id);
    if(!hasInv)return'invoice_needed';
    const hasPay=db.payments.find(p=>p.invoiceId&&db.invoices.find(i=>i.id===p.invoiceId&&(i.visitId===v.id||i.reportId===rpt.id)));
    return hasPay?'paid':'invoice_pending';
  }
  if(v.status==='In Progress')return'in_progress';
  // Scheduled
  return'assigned';
}

function quickAssign(visitId){
  const db=rDB();
  const v=db.visits.find(x=>x.id===visitId);if(!v)return;
  const engineers=db.users.filter(u=>u.role==='engineer');
  SM(`<div class="mhd"><h3>👤 Assign Engineer</h3><button class="btn btn-s btn-xs" onclick="CM()">✕</button></div>
  <div class="mbody">
    <div class="form-group mb-16"><label class="bold">${v.visitNo} — ${v.customer}</label><div class="txt-fg2" style="font-size:13px">${v.location||''} ${v.visitDate?'· '+fmt(v.visitDate):''}</div></div>
    <div class="form-group"><label>Engineer *</label><select id="qa-eng">
      <option value="">— Select Engineer —</option>
      ${engineers.map(e=>`<option value="${e.id}" ${v.engineerId===e.id?'selected':''}>${e.name}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Visit Date</label><input id="qa-date" type="date" value="${v.visitDate||today()}"></div>
    <div class="form-group"><label>Notes for Engineer</label><textarea id="qa-notes" rows="2" placeholder="Any special instructions...">${v.assignNotes||''}</textarea></div>
  </div>
  <div class="mfoot"><button class="btn btn-s" onclick="CM()">Cancel</button><button class="btn btn-p" onclick="doAssign('${visitId}')">Assign & Notify</button></div>`);
}
function doAssign(visitId){
  const engId=document.getElementById('qa-eng')?.value;
  if(!engId){alert('Select an engineer');return;}
  const db=rDB();const i=db.visits.findIndex(x=>x.id===visitId);if(i<0)return;
  db.visits[i].engineerId=engId;
  db.visits[i].visitDate=document.getElementById('qa-date').value||db.visits[i].visitDate;
  db.visits[i].assignNotes=document.getElementById('qa-notes').value.trim();
  db.visits[i].status=db.visits[i].status==='Scheduled'?'Scheduled':'Scheduled';
  sDB(db);CM();pgDashboard();
}

function pgDashboard(){
  const db=rDB();
  const u=CU;
  let html='';

  // ── Pipeline stages (all active visits, not cancelled) ──
  const activeV=db.visits.filter(v=>v.status!=='Cancelled');
  const stages={unassigned:0,assigned:0,in_progress:0,report_pending:0,quotation_needed:0,invoice_needed:0,invoice_pending:0,paid:0};
  activeV.forEach(v=>{const s=_visitStage(v,db);if(stages[s]!==undefined)stages[s]++;});
  const PIPE=[
    {key:'unassigned',label:'Unassigned',icon:'⚪',cls:'err'},
    {key:'assigned',label:'Assigned',icon:'🔵',cls:'warn'},
    {key:'in_progress',label:'In Progress',icon:'🟡',cls:'warn'},
    {key:'report_pending',label:'Report Pending',icon:'🟠',cls:'warn'},
    {key:'quotation_needed',label:'Quotation',icon:'📝',cls:'info'},
    {key:'invoice_needed',label:'Invoice',icon:'🧾',cls:'info'},
    {key:'invoice_pending',label:'Payment',icon:'💳',cls:'info'},
    {key:'paid',label:'Paid',icon:'✅',cls:'good'},
  ];

  if(u.role==='admin'||u.role==='site_incharge'){
    // ── Pipeline strip ──
    html+=`<div class="pipeline-strip">
      ${PIPE.map((p,idx)=>`<div class="pipe-stage ${stages[p.key]>0?'pipe-active':''}">
        <div class="pipe-icon">${p.icon}</div>
        <div class="pipe-count pipe-${p.cls}">${stages[p.key]}</div>
        <div class="pipe-lbl">${p.label}</div>
      </div>${idx<PIPE.length-1?'<div class="pipe-arrow">›</div>':''}`).join('')}
    </div>`;

    // ── Stats ──
    const openPO=db.purchaseOrders.filter(p=>p.status==='Open').length;
    const totalReceived=db.payments.reduce((s,p)=>s+Number(p.amount||0),0);
    html+=`<div class="stats-grid">
      <div class="stat-card"><div class="stat-num txt-err">${stages.unassigned}</div><div class="stat-lbl">Unassigned Visits</div></div>
      <div class="stat-card"><div class="stat-num txt-warn">${stages.assigned+stages.in_progress}</div><div class="stat-lbl">Active Visits</div></div>
      <div class="stat-card"><div class="stat-num txt-warn">${stages.report_pending}</div><div class="stat-lbl">Reports Pending</div></div>
      <div class="stat-card"><div class="stat-num">${openPO}</div><div class="stat-lbl">Open POs</div></div>
      <div class="stat-card"><div class="stat-num txt-good">${fmtMoney(totalReceived)}</div><div class="stat-lbl">Total Received</div></div>

        <tr><th>Visit #</th><th>Customer</th><th>Location</th><th>Engineer</th><th>Date</th><th>Stage</th><th>Action</th></tr>
        ${activeAssigned.slice().reverse().slice(0,15).map(v=>{
          const eng=db.users.find(u=>u.id===v.engineerId);

          const eng=db.users.find(u=>u.id===v.engineerId);

            <td class="bold">${v.visitNo}</td><td>${v.customer}</td><td>${v.location||'-'}</td>
            <td>${eng?eng.name:'-'}</td><td>${fmt(v.visitDate)}</td>
            <td><button class="btn btn-s btn-xs" onclick="navTo('reports')">Reports</button></td>
          </tr>`;
        }).join('')}
      </table></div></div>`;
    }
  }

  if(u.role==='admin'||u.role==='finance'){

    const invNeeded=db.visits.filter(v=>_visitStage(v,db)==='invoice_needed');
    const invPending=db.visits.filter(v=>_visitStage(v,db)==='invoice_pending');

    if(qNeeded.length){
      html+=`<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>📝 Quotation Queue (${qNeeded.length})</span>
        <span style="font-size:12px;color:var(--info)">Reports with required spares — create quotation</span>
      </div><div class="tbl-wrap"><table>
        <tr><th>Visit #</th><th>Customer</th><th>Location</th><th>Report</th><th>Action</th></tr>
        ${qNeeded.slice(0,10).map(v=>{
          const rpt=db.reports.find(r=>r.visitId===v.id);
          return`<tr>
            <td class="bold">${v.visitNo}</td><td>${v.customer}</td><td>${v.location||'-'}</td>
            <td>${rpt?rpt.reportNo||rpt.id.slice(-6):'-'}</td>

        <span style="font-size:12px;color:var(--info)">AMC visits ready — create invoice</span>
      </div><div class="tbl-wrap"><table>

            <td>${po?po.poNo:'-'}</td>
            <td><button class="btn btn-p btn-xs" onclick="navTo('invoices')">Create Invoice</button></td>

    if(invPending.length){
      html+=`<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">

        <span style="font-size:12px;color:var(--warn)">Invoice raised — awaiting payment</span>
      </div><div class="tbl-wrap"><table>
        <tr><th>Visit #</th><th>Customer</th><th>Location</th><th>Invoice</th><th>Amount</th><th>Action</th></tr>
        ${invPending.slice(0,10).map(v=>{
          const inv=db.invoices.find(i=>i.visitId===v.id);
          return`<tr>
            <td class="bold">${v.visitNo}</td><td>${v.customer}</td><td>${v.location||'-'}</td>

          </tr>`;
        }).join('')}
      </table></div></div>`;
    }

    // ── HPCL visit reminders ──
    const hpclC=getHPCLContract();
    if(hpclC){
      const todayStr=today();
      const dueList=hpclC.depots.map(depot=>{
        const done=hpclVisitsDone(depot.line,db.visits);
        if(done>=hpclC.totalVisits)return null;
        const nextDue=hpclNextDue(depot.line,db.visits);
        const daysLeft=Math.ceil((new Date(nextDue)-new Date(todayStr))/(1000*60*60*24));
        return{...depot,nextDue,daysLeft,done};
      }).filter(d=>d&&d.daysLeft<=60).sort((a,b)=>a.daysLeft-b.daysLeft);
      if(dueList.length){
        const overdue=dueList.filter(d=>d.daysLeft<0).length;
        html+=`<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">

            return`<tr>
              <td class="bold">${d.name}</td>
              <td class="txt-fg2" style="font-size:12px">${d.state}</td>
              <td>${d.done+1} of ${hpclC.totalVisits}</td>

              <td><span class="bold" style="${urgCls}">${urgTxt}</span></td>
            </tr>`;
          }).join('')}
        </table></div></div>`;
      }
    }

    // ── Recent Payments ──
    const recentPays=db.payments.slice(-5).reverse();
    if(recentPays.length){
      html+=`<div class="card"><div class="card-title">💰 Recent Payments</div><div class="tbl-wrap"><table>
        <tr><th>Date</th><th>Invoice</th><th>Amount</th><th>Mode</th><th>TDS</th></tr>
        ${recentPays.map(p=>{const inv=db.invoices.find(i=>i.id===p.invoiceId);return`<tr>

          <td>${p.mode||'-'}</td><td>${fmtMoney(p.tds)}</td>
        </tr>`}).join('')}
      </table></div></div>`;
    }

  }

  // ── Engineer dashboard (standalone, not in else-if) ──
  if(u.role==='engineer'){
    const myV=db.visits.filter(v=>v.engineerId===u.id&&v.status!=='Cancelled');
    const myR=db.reports.filter(r=>myV.find(v=>v.id===r.visitId));
    const rptNeeded=myV.filter(v=>v.status==='Completed'&&!db.reports.find(r=>r.visitId===v.id));
    const upcoming=myV.filter(v=>v.status==='Scheduled'||v.status==='In Progress');
    html+=`<div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${myV.length}</div><div class="stat-lbl">My Visits</div></div>
      <div class="stat-card"><div class="stat-num txt-warn">${upcoming.length}</div><div class="stat-lbl">Pending / Active</div></div>
      <div class="stat-card"><div class="stat-num txt-warn">${rptNeeded.length}</div><div class="stat-lbl">Reports Needed</div></div>
      <div class="stat-card"><div class="stat-num txt-good">${myR.length}</div><div class="stat-lbl">Reports Submitted</div></div>
    </div>`;
    if(upcoming.length){
      html+=`<div class="card"><div class="card-title">📍 My Assigned Visits</div><div class="tbl-wrap"><table>
        <tr><th>Visit #</th><th>Customer</th><th>Location</th><th>Date</th><th>Status</th><th>Notes</th><th>Action</th></tr>
        ${upcoming.map(v=>`<tr>
          <td class="bold">${v.visitNo}</td><td>${v.customer}</td><td>${v.location||'-'}</td>
          <td>${fmt(v.visitDate)}</td>
          <td><span class="badge badge-${v.status==='In Progress'?'checkedin':'pending'}">${v.status}</span></td>
          <td class="txt-fg2" style="font-size:12px">${v.assignNotes||'-'}</td>
          <td><button class="btn btn-g btn-xs" onclick="navTo('checkin')">Check-In</button>
          <button class="btn btn-s btn-xs" onclick="viewVisit('${v.id}')">View</button></td>
        </tr>`).join('')}
      </table></div></div>`;
    } else {
      html+=`<div class="card"><div style="text-align:center;padding:32px;color:var(--fg2)">✅ No pending visits assigned to you</div></div>`;
    }
    if(rptNeeded.length){
      html+=`<div class="card"><div class="card-title" style="color:var(--warn)">⚠️ Reports Required (${rptNeeded.length})</div><div class="tbl-wrap"><table>
        <tr><th>Visit #</th><th>Customer</th><th>Location</th><th>Date</th><th>Action</th></tr>
        ${rptNeeded.map(v=>`<tr>
          <td class="bold">${v.visitNo}</td><td>${v.customer}</td><td>${v.location||'-'}</td>
          <td>${fmt(v.visitDate)}</td>
          <td><button class="btn btn-p btn-xs" onclick="openAddReport('${v.id}')">Create Report</button></td>
        </tr>`).join('')}
      </table></div></div>`;
    }
  }

  document.getElementById('content').innerHTML=html||'<div class="empty-state"><div class="ei">🏠</div><p>Dashboard</p></div>';
}

function editPO(id){openAddPO(id);}

let _poFile=null,_poFileName='';
function handlePOFile(inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert('File too large (max 2MB)');return;}
  const r=new FileReader();
  r.onload=e=>{_poFile=e.target.result;_poFileName=f.name;
    document.getElementById('po-file-preview').innerHTML=`<span class="file-chip">📄 ${f.name} <button class="dr" style="font-size:12px" onclick="clearPOFile()">✕</button></span>`;
  };r.readAsDataURL(f);
}
function clearPOFile(){_poFile=null;_poFileName='';document.getElementById('po-file-preview').innerHTML='';}

function savePO(id){
  const db=rDB();
  const po={
    id:id||uid(),poNo:document.getElementById('po-no').value.trim(),
    poDate:document.getElementById('po-date').value,
    customer:document.getElementById('po-cust').value,
    location:document.getElementById('po-loc').value.trim(),
    poValue:document.getElementById('po-val').value,
    contractType:document.getElementById('po-ctype').value,
    status:document.getElementById('po-status').value,
    validFrom:document.getElementById('po-from').value,
    validTo:document.getElementById('po-to').value,
    duration:soVal('po-dur'),
    eqQty:document.getElementById('po-eqqty').value,
    visitCycle:document.getElementById('po-vcycle').value,
    equipmentType:document.getElementById('po-eqtype').value,
    releaseOrderQty:document.getElementById('po-roqty').value,
    releaseOrderRate:document.getElementById('po-rorate').value,
    nextVisitDue:document.getElementById('po-nextdue').value,
    visitStatus:soVal('po-vstatus'),
    scope:document.getElementById('po-scope').value.trim()
  };
  if(!po.poNo){alert('PO Number required');return;}
  if(_poFile){po.attachment=_poFile;po.attachmentName=_poFileName;}
  else if(id){const ex=db.purchaseOrders.find(p=>p.id===id);if(ex?.attachment){po.attachment=ex.attachment;po.attachmentName=ex.attachmentName;}}
  if(id){const i=db.purchaseOrders.findIndex(p=>p.id===id);if(i>=0)db.purchaseOrders[i]=po;}
  else db.purchaseOrders.push(po);
  sDB(db);CM();_poFile=null;_poFileName='';pgPO();
}

let _vFile=null,_vFileName='';
function handleVFile(inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert('File too large (max 2MB)');return;}
  const r=new FileReader();
  r.onload=e=>{_vFile=e.target.result;_vFileName=f.name;
    document.getElementById('v-file-preview').innerHTML=`<span class="file-chip">📄 ${f.name} <button class="dr" style="font-size:11px" onclick="clearVFile()">✕</button></span>`;
  };r.readAsDataURL(f);
}
function clearVFile(){_vFile=null;_vFileName='';document.getElementById('v-file-preview').innerHTML='';}

function saveVisit(id){
  const db=rDB();
  const custVal=document.getElementById('v-cust').value;
  const depotLineVal=parseInt(document.getElementById('v-depot')?.value)||null;
  let contractId='',perVisitQty=null;
  if(custVal==='HPCL'&&depotLineVal){
    const hcon=getHPCLContract();
    const dep=hcon?.depots.find(d=>d.line===depotLineVal);
    if(dep){contractId='contract_hpcl_5300052389';perVisitQty=dep.perVisitQty;}
  }
  const v={id:id||uid(),visitNo:document.getElementById('v-no').value.trim(),
    customer:custVal,location:document.getElementById('v-loc').value.trim(),
    state:document.getElementById('v-state').value,
    visitDate:document.getElementById('v-date').value,poId:document.getElementById('v-po').value,
    contractType:document.getElementById('v-ctype').value,
    engineerId:document.getElementById('v-eng').value,status:document.getElementById('v-status').value,
    travelMode:document.getElementById('v-tmode').value,travelFrom:document.getElementById('v-tfrom').value.trim(),
    travelTo:document.getElementById('v-tto').value.trim(),travelDep:document.getElementById('v-tdep').value,
    travelRet:document.getElementById('v-tret').value,travelNotes:document.getElementById('v-tnotes').value.trim(),
    notes:document.getElementById('v-notes').value.trim(),
    contractId,depotLine:depotLineVal,perVisitQty
  };
  if(!v.visitNo){alert('Visit Number required');return;}
  if(_vFile){v.travelFile=_vFile;v.travelFileName=_vFileName;}
  else if(id){const ex=db.visits.find(x=>x.id===id);if(ex?.travelFile){v.travelFile=ex.travelFile;v.travelFileName=ex.travelFileName;}}
  if(id){const i=db.visits.findIndex(x=>x.id===id);if(i>=0)db.visits[i]=v;}else db.visits.push(v);
  sDB(db);CM();_vFile=null;_vFileName='';pgVisits();
}

function doCheckin(vid){
  const selId=vid||document.getElementById('ci-visit')?.value;
  if(!selId){alert('Please select a visit');return;}
  const note=document.getElementById('ci-note')?.value||'';
  const gpsEl=document.getElementById('gps-status');
  const inlineBtn=vid?document.getElementById('ci-btn-'+vid):null;
  if(gpsEl)gpsEl.innerHTML='📡 Getting GPS location...';
  if(inlineBtn){inlineBtn.disabled=true;inlineBtn.textContent='📡 Checking in...';}
  const doSave=(lat,lng)=>{
    const db=rDB();
    const v=db.visits.find(x=>x.id===selId);if(!v){if(inlineBtn){inlineBtn.disabled=false;inlineBtn.textContent='Check-In';}return;}
    v.checkIn={date:today(),time:new Date().toTimeString().slice(0,5),lat,lng,note};
    v.status='In Progress';
    sDB(db);
    if(gpsEl)gpsEl.innerHTML=`<strong class="txt-good">✅ Checked in!</strong><div class="gps-coords">${lat?`📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`:'Location not available'}</div>`;
    if(inlineBtn)inlineBtn.textContent='✅ Checked in!';
    setTimeout(()=>navTo(CU.role==='engineer'?'my_visits':'visits'),1000);
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>doSave(p.coords.latitude,p.coords.longitude),
      ()=>doSave(null,null),
      {timeout:8000}
    );
  } else doSave(null,null);
}

function _fillReportFromVisit(visitId,db){
  if(!visitId)return;
  db=db||rDB();
  const vx=db.visits.find(x=>x.id===visitId);if(!vx)return;
  // location
  const locEl=document.getElementById('r-loc');if(locEl&&!locEl.value&&vx.location)locEl.value=vx.location;
  // linked PO fields
  const po=db.purchaseOrders.find(p=>p.id===vx.poId);
  if(po){
    const cnoEl=document.getElementById('r-cno');if(cnoEl&&!cnoEl.value)cnoEl.value=po.poNo;
    const poDtEl=document.getElementById('r-podate');if(poDtEl&&!poDtEl.value)poDtEl.value=po.poDate||'';
    // PO tracking fields
    const DUR_OPTS=['6 Months','1 Year','2 Years','3 Years'];
    const VS_OPTS=['Planned','Assigned','Work in Progress','Completed'];
    if(po.duration)soSet('r-duration',po.duration,DUR_OPTS);
    if(po.eqQty){
      const eqSel=document.getElementById('r-eqqty');
      const eqOth=document.getElementById('r-eqqty-oth');
      const knownQtys=[6,12,17,24,32,48,60,72,84,96,100,120,150,200].map(String);
      if(eqSel){
        const qStr=String(po.eqQty);
        if(knownQtys.includes(qStr)){eqSel.value=qStr;if(eqOth)eqOth.style.display='none';}
        else{eqSel.value='Others';if(eqOth){eqOth.style.display='block';eqOth.value=qStr;}}
      }
    }
    if(po.visitStatus)soSet('r-vstatus',po.visitStatus,VS_OPTS);
    if(po.nextVisitDue){const nd=document.getElementById('r-nextdue');if(nd)nd.value=po.nextVisitDue;}
  }
  // HPCL specific auto-fill
  if(vx.contractId==='contract_hpcl_5300052389'&&vx.depotLine){
    const hcon=getHPCLContract();
    const depot=hcon?.depots.find(d=>d.line===vx.depotLine);
    if(depot){
      const cnoEl=document.getElementById('r-cno');if(cnoEl&&!cnoEl.value)cnoEl.value='5300052389';
      const qtyEl=document.getElementById('r-rosovqty');if(qtyEl&&!qtyEl.value)qtyEl.value=depot.perVisitQty+' Nos';
      const vcEl=document.getElementById('r-vcode');if(vcEl&&!vcEl.value)vcEl.value='50027355';
      const subj=document.getElementById('r-subj');if(subj)subj.value='AMC of MOV';
      const poDtEl=document.getElementById('r-podate');if(poDtEl&&!poDtEl.value)poDtEl.value='2026-09-11';
      // PO tracking for HPCL
      soSet('r-duration','2 Years',['6 Months','1 Year','2 Years','3 Years']);
      const eqSel=document.getElementById('r-eqqty');
      const eqOth=document.getElementById('r-eqqty-oth');
      const qStr=String(depot.perVisitQty);
      const knownQtys=[6,12,17,24,32,48,60,72,84,96,100,120,150,200].map(String);
      if(eqSel){
        if(knownQtys.includes(qStr)){eqSel.value=qStr;if(eqOth)eqOth.style.display='none';}
        else{eqSel.value='Others';if(eqOth){eqOth.style.display='block';eqOth.value=qStr;}}
      }
      const nd=document.getElementById('r-nextdue');
      if(nd)nd.value=hpclNextDue(depot.line,db.visits);
    }
  }
}

// ===== AUTO-CREATE QUOTATION & INVOICE FROM REPORT SPARES =====
function _autoCreateFinanceDocs(reportId, db){
  const report=db.reports.find(x=>x.id===reportId);
  if(!report||!report.equipment||!report.equipment.length) return;

  // Get visit & PO info for pre-filling customer details
  const visit=report.visitId?db.visits.find(v=>v.id===report.visitId):null;
  const po=visit&&visit.poId?db.purchaseOrders.find(p=>p.id===visit.poId):null;
  const customer=visit?.customer||report.site?.location||'';
  const siteLoc=report.site?.location||visit?.location||'';
  const poRef=po?.poNo||report.site?.contractNo||'';
  const vendorCode=report.site?.vendorCode||'';
  const contactPerson=report.site?.officerName||'';
  const clientEmail=report.site?.conversionEmail||'';
  const amcType=report.rtype||'AMC';

  // ── 1. RECOMMENDED SPARES → Auto Quotation ──
  const recSpareMap={};
  report.equipment.forEach(eq=>{
    const list=eq.recommendedSparesList&&eq.recommendedSparesList.length
      ? eq.recommendedSparesList
      : (eq.recommendedSpares?eq.recommendedSpares.split(',').map(s=>({name:s.trim(),qty:1})):[]);
    list.forEach(sp=>{
      if(!sp.name) return;
      const key=sp.name.toLowerCase().trim();
      if(recSpareMap[key]){recSpareMap[key].qty+=Number(sp.qty)||1;}
      else{recSpareMap[key]={name:sp.name,qty:Number(sp.qty)||1,
        tankNo:eq.tankNo||'',actuatorType:eq.actuatorType||'',modelNo:eq.modelNo||''};}
    });
  });
  const recSpares=Object.values(recSpareMap);

  // Create or UPDATE quotation from recommended spares
  const existQuot=db.quotations.find(q=>q.reportId===reportId && q.autoGenerated);
  if(recSpares.length){
    const qItems=recSpares.map(sp=>({
      id:uid(), modelNo:sp.modelNo, description:sp.name,
      tankNo:sp.tankNo, qty:sp.qty, unit:'Nos', unitPrice:'', amount:0
    }));
    if(existQuot && existQuot.status==='draft'){
      // Update existing draft — keep id/quotNo/createdAt, refresh items & details
      existQuot.items=qItems;
      existQuot.customer=customer; existQuot.site=siteLoc;
      existQuot.contactPerson=contactPerson; existQuot.clientEmail=clientEmail;
      existQuot.vendorCode=vendorCode; existQuot.orderNo=poRef;
      existQuot.amcType=amcType; existQuot.subtotal=0;
      existQuot.gstAmount=0; existQuot.totalWithGst=0;
      existQuot.updatedAt=new Date().toISOString();
    } else if(!existQuot){
      const autoQuot={
        id:uid(), reportId:reportId, quotNo:'Q-AUTO-'+report.reportNo,
        quotDate:today(), customer:customer, site:siteLoc,
        contactPerson:contactPerson, designation:'',
        clientPhone:'', clientEmail:clientEmail, clientGstin:'', vendorCode:vendorCode,
        orderNo:poRef, deliveryTime:'4-6 weeks',
        paymentTerms:'30 days from invoice date', validity:'30 days from date of issue',
        otherConditions:'GST @18% extra as applicable.',
        items:qItems, subtotal:0, gstAmount:0, totalWithGst:0, gst:18,
        status:'draft', autoGenerated:true,
        autoSource:'recommended_spares', amcType:amcType,
        createdAt:new Date().toISOString()
      };
      db.quotations.push(autoQuot);
    }
    // If existQuot exists but status !== 'draft' (finance already completed it), don't touch it
  } else if(existQuot && existQuot.status==='draft'){
    // All recommended spares removed from report → remove the draft quotation
    db.quotations=db.quotations.filter(q=>q.id!==existQuot.id);
  }

  // ── 2. CONSUMED SPARES → Auto Invoice ──
  const conSpareMap={};
  report.equipment.forEach(eq=>{
    const list=eq.consumedSparesList&&eq.consumedSparesList.length
      ? eq.consumedSparesList
      : (eq.consumedSpares?eq.consumedSpares.split(',').map(s=>({name:s.trim(),qty:1})):[]);
    list.forEach(sp=>{
      if(!sp.name) return;
      const key=sp.name.toLowerCase().trim();
      if(conSpareMap[key]){conSpareMap[key].qty+=Number(sp.qty)||1;}
      else{conSpareMap[key]={name:sp.name,qty:Number(sp.qty)||1,
        tankNo:eq.tankNo||'',actuatorType:eq.actuatorType||'',modelNo:eq.modelNo||''};}
    });
  });
  const conSpares=Object.values(conSpareMap);

  // Create or UPDATE invoice from consumed spares
  const existInv=db.invoices.find(inv=>inv.reportId===reportId && inv.autoSource==='consumed_spares');
  if(conSpares.length){
    const invItems=conSpares.map(sp=>({
      id:uid(), description:sp.name+' (Consumed - '+amcType+')',
      hsn:'8481', qty:sp.qty, unit:'Nos', unitPrice:'', amount:0,
      gstRate:18, gstAmount:0, totalWithGst:0
    }));
    if(existInv && existInv.status==='draft'){
      // Update existing draft — keep id/invoiceNo/createdAt, refresh items & details
      existInv.items=invItems;
      existInv.customer=customer; existInv.site=siteLoc;
      existInv.contactPerson=contactPerson; existInv.clientEmail=clientEmail;
      existInv.vendorCode=vendorCode; existInv.orderNo=poRef;
      existInv.amcType=amcType; existInv.subtotal=0;
      existInv.totalGst=0; existInv.grandTotal=0;
      existInv.notes=amcType+' - Consumed spares from Report '+report.reportNo;
      existInv.updatedAt=new Date().toISOString();
    } else if(!existInv){
      const _vState=visit?.state||'';
      const _isH=_vState.toLowerCase().includes('haryana');
      const autoInv={
        id:uid(), reportId:reportId, quotationId:'',
        invoiceNo:'INV-AUTO-'+report.reportNo,
        invoiceDate:today(),
        dueDate:new Date(Date.now()+15*864e5).toISOString().slice(0,10),
        orderNo:poRef,
        clientOrderNo:report.site?.clientOrderNo||'',
        releaseOrderNo:report.site?.releaseOrderNo||'',
        countryOfSupply:'India', placeOfSupply:_vState,
        gstType:_isH?'cgst_sgst':'igst',
        customer:customer, site:siteLoc,
        contactPerson:contactPerson, designation:'',
        clientPhone:'', clientEmail:clientEmail, clientGstin:'', clientPan:'',
        vendorCode:vendorCode,
        paymentTerms:'30 days from invoice date',
        items:invItems, subtotal:0, totalGst:0, grandTotal:0,
        notes:amcType+' - Consumed spares from Report '+report.reportNo,
        status:'draft', autoGenerated:true,
        autoSource:'consumed_spares', amcType:amcType,
        createdAt:new Date().toISOString()
      };
      db.invoices.push(autoInv);
    }
    // If existInv exists but status !== 'draft' (finance already completed it), don't touch it
  } else if(existInv && existInv.status==='draft'){
    // All consumed spares removed from report → remove the draft invoice
    db.invoices=db.invoices.filter(inv=>inv.id!==existInv.id);
  }

  // ── 3. AMC SERVICE INVOICE → Auto-create on report submission ──
  const visitState=visit?.state||'';
  const isHaryana=visitState.toLowerCase().includes('haryana');
  const existAmcInv=db.invoices.find(inv=>inv.reportId===reportId && inv.autoSource==='amc_service');
  // Build AMC items from equipment in report
  const amcItems=report.equipment.map((eq,i)=>({
    id:uid(), description:'AMC Service - '+(eq.actuatorType||'Equipment')+' ('+amcType+') — '+(eq.tankNo||'Unit '+(i+1)),
    hsn:'998719', qty:1, unit:'Nos', unitPrice:'', amount:0,
    gstRate:18, gstAmount:0, totalWithGst:0
  }));
  if(amcItems.length){
    if(existAmcInv && existAmcInv.status==='draft'){
      existAmcInv.items=amcItems;
      existAmcInv.customer=customer; existAmcInv.site=siteLoc;
      existAmcInv.contactPerson=contactPerson; existAmcInv.clientEmail=clientEmail;
      existAmcInv.vendorCode=vendorCode; existAmcInv.orderNo=poRef;
      existAmcInv.clientOrderNo=report.site?.clientOrderNo||'';
      existAmcInv.amcType=amcType; existAmcInv.subtotal=0;
      existAmcInv.totalGst=0; existAmcInv.grandTotal=0;
      existAmcInv.placeOfSupply=visitState;
      existAmcInv.gstType=isHaryana?'cgst_sgst':'igst';
      existAmcInv.notes=amcType+' Service charges from Report '+report.reportNo;
      existAmcInv.updatedAt=new Date().toISOString();
    } else if(!existAmcInv){
      const amcInv={
        id:uid(), reportId:reportId, quotationId:'',
        invoiceNo:'INV-AMC-'+report.reportNo,
        invoiceDate:today(),
        dueDate:new Date(Date.now()+15*864e5).toISOString().slice(0,10),
        orderNo:poRef,
        clientOrderNo:report.site?.clientOrderNo||'',
        releaseOrderNo:report.site?.releaseOrderNo||'',
        countryOfSupply:'India', placeOfSupply:visitState,
        gstType:isHaryana?'cgst_sgst':'igst',
        customer:customer, site:siteLoc,
        contactPerson:contactPerson, designation:'',
        clientPhone:'', clientEmail:clientEmail, clientGstin:'', clientPan:'',
        vendorCode:vendorCode,
        paymentTerms:'30 days from invoice date',
        items:amcItems, subtotal:0, totalGst:0, grandTotal:0,
        notes:amcType+' Service charges from Report '+report.reportNo,
        status:'draft', autoGenerated:true,
        autoSource:'amc_service', amcType:amcType,
        createdAt:new Date().toISOString()
      };
      db.invoices.push(amcInv);
    }
  } else if(existAmcInv && existAmcInv.status==='draft'){
    db.invoices=db.invoices.filter(inv=>inv.id!==existAmcInv.id);
  }
}

function exportDoc(html, title, mode){
  if(!html){alert('Document data not found.');return;}
  var w=window.open('','_blank');
  if(!w){alert('Pop-up block ho gaya. Browser mein pop-up allow karein aur dobara try karein.');return;}
  w.document.open();w.document.write(html);w.document.close();
  w.document.title=title;
  if(mode==='pdf'){
    // slight delay to let images load, then print
    setTimeout(function(){try{w.print();}catch(e){}},800);
  }
  // For word: user can File > Save As from the new window, Word can open HTML
}

function exportQ(id,mode){exportDoc(genQuotDoc(id),id,mode);}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function saveAutoQuot(qId){
  const db=rDB();const idx=db.quotations.findIndex(x=>x.id===qId);if(idx<0){alert('Quotation not found');return;}
  const no=document.getElementById('q-no').value.trim();if(!no){alert('Quotation No required');return;}
  const sub=_qItems.reduce((s,i)=>s+Number(i.amount||0),0);
  db.quotations[idx]={...db.quotations[idx],
    quotNo:no, quotDate:document.getElementById('q-date').value,
    customer:document.getElementById('q-cust').value,
    site:document.getElementById('q-site').value.trim(),
    contactPerson:document.getElementById('q-contact').value.trim(),
    designation:document.getElementById('q-designation').value.trim(),
    clientPhone:document.getElementById('q-cphone').value.trim(),
    clientEmail:document.getElementById('q-cemail').value.trim(),
    clientGstin:(document.getElementById('q-cgstin').value.trim()).toUpperCase(),
    vendorCode:document.getElementById('q-vcode').value.trim(),
    orderNo:document.getElementById('q-order').value.trim(),
    deliveryTime:document.getElementById('q-del').value.trim(),
    paymentTerms:document.getElementById('q-pay').value.trim(),
    validity:document.getElementById('q-validity').value.trim(),
    otherConditions:document.getElementById('q-cond').value.trim(),
    items:_qItems.map(it=>({...it})),subtotal:sub,gstAmount:sub*0.18,totalWithGst:sub*1.18,
    updatedAt:new Date().toISOString()
  };
  sDB(db);CM();pgQuotations();
}

function genQ(reportId){
  const db=rDB();const r=reportId?db.reports.find(x=>x.id===reportId):null;
  if(r&&r.equipment&&r.equipment.length){
    // Consolidate recommended spares: same spare name → one line, sum qty
    const spareMap={};
    r.equipment.forEach(eq=>{
      const list=eq.recommendedSparesList&&eq.recommendedSparesList.length
        ?eq.recommendedSparesList
        :(eq.recommendedSpares?eq.recommendedSpares.split(',').map(s=>({name:s.trim(),qty:1})):[]);
      list.forEach(sp=>{
        if(!sp.name)return;
        const key=sp.name.toLowerCase().trim();
        if(spareMap[key]){spareMap[key].qty+=Number(sp.qty)||1;}
        else{spareMap[key]={name:sp.name,qty:Number(sp.qty)||1};}
      });
    });
    _qItems=Object.values(spareMap).map(sp=>({
      id:uid(),modelNo:'',description:sp.name,tankNo:'',qty:sp.qty,unit:'Nos',unitPrice:'',amount:0
    }));

  if(!_qItems.length)_qItems=[{id:uid(),modelNo:'',description:'',tankNo:'',qty:1,unit:'Nos',unitPrice:'',amount:0}];
  const v=r?.visitId?db.visits.find(x=>x.id===r.visitId):null;

function renderQItems(){

  wrap.innerHTML=`<table style="min-width:760px"><tr><th style="width:36px">#</th><th style="width:110px">Model No</th><th>Description / Particulars</th><th style="width:60px;text-align:right">Qty</th><th style="width:60px">Unit</th><th style="width:110px;text-align:right">Unit Price</th><th style="width:110px;text-align:right">Amount</th><th style="width:30px"></th></tr>
  ${_qItems.map((it,i)=>`<tr>
    <td style="text-align:center;color:var(--fg3)">${i+1}</td>
    <td><input style="min-width:100px" value="${it.modelNo}" onchange="_qItems[${i}].modelNo=this.value"></td>

    <td><input style="min-width:50px" value="${it.unit||'Nos'}" onchange="_qItems[${i}].unit=this.value"></td>
    <td><input type="number" style="min-width:90px;text-align:right" value="${it.unitPrice}" placeholder="0.00" onchange="_qItems[${i}].unitPrice=this.value;calcQRow(${i})"></td>
    <td style="text-align:right;font-weight:600" id="q-amt-${i}">${fmtMoney(it.amount)}</td>
    <td><button class="dr" onclick="removeQItem(${i})">✕</button></td>
  </tr>`).join('')}</table>`;
  updateQTotal();
}
function addQItem(){_qItems.push({id:uid(),modelNo:'',description:'',qty:1,unit:'Nos',unitPrice:'',amount:0});renderQItems();}
function removeQItem(i){if(_qItems.length<=1)return;_qItems.splice(i,1);renderQItems();}
function calcQRow(i){const it=_qItems[i];it.amount=Number(it.qty||0)*Number(it.unitPrice||0);const el=document.getElementById(`q-amt-${i}`);if(el)el.textContent=fmtMoney(it.amount);updateQTotal();}
function updateQTotal(){const sub=_qItems.reduce((s,i)=>s+Number(i.amount||0),0);const gst=sub*0.18;const el=document.getElementById('q-total');if(el)el.innerHTML=`Subtotal: ${fmtMoney(sub)} &nbsp;|&nbsp; GST 18%: ${fmtMoney(gst)} &nbsp;|&nbsp; <span style="font-size:16px">Total: ${fmtMoney(sub+gst)}</span>`;}

function saveQ(reportId){
  const db=rDB();

  const sub=_qItems.reduce((s,i)=>s+Number(i.amount||0),0);
  const q={id:uid(),reportId,quotNo:no,quotDate:document.getElementById('q-date').value,
    customer:document.getElementById('q-cust').value,site:document.getElementById('q-site').value.trim(),

    designation:document.getElementById('q-designation').value.trim(),
    clientPhone:document.getElementById('q-cphone').value.trim(),
    clientEmail:document.getElementById('q-cemail').value.trim(),

    paymentTerms:document.getElementById('q-pay').value.trim(),
    validity:document.getElementById('q-validity').value.trim(),

}

function confirmAcceptQuot(qId){
  const db=rDB();const q=db.quotations.find(x=>x.id===qId);if(!q)return;
  q.status='accepted';
  q.acceptedOn=document.getElementById('acc-date').value||today();

  // ── Auto-create draft CHALLAN from quotation ──
  if(!db.challans)db.challans=[];
  const existChallan=db.challans.find(c=>c.quotationId===qId);
  if(!existChallan){
    const dcItems=(q.items||[]).map(it=>({id:uid(),description:it.description||'',hsn:it.hsn||'',qty:Number(it.qty||1),unit:it.unit||'Nos'}));
    const autoChallan={
      id:uid(), quotationId:qId, challanNo:'DC-AUTO-'+q.quotNo.replace(/^Q-AUTO-/,''),
      challanDate:today(), purpose:'For Sale', status:'draft',
      refNo:q.orderNo||'', vehicleNo:'', transportMode:'Road',
      transporter:'', lrNo:'', driverName:'',
      customer:q.customer||'', site:q.site||'',
      contactPerson:q.contactPerson||'', designation:q.designation||'',
      clientPhone:q.clientPhone||'', clientGstin:q.clientGstin||'',
      vendorCode:q.vendorCode||'', remarks:'Auto-drafted from Quotation '+q.quotNo,
      linkedRef:qId+':quotation',
      items:dcItems, autoGenerated:true, autoSource:'quotation_accepted',
      createdAt:new Date().toISOString()
    };
    db.challans.push(autoChallan);
  }

  // ── Auto-create draft INVOICE from quotation ──
  const existInv=db.invoices.find(inv=>inv.quotationId===qId && inv.autoSource==='quotation_accepted');
  if(!existInv){
    const invItems=(q.items||[]).map(it=>({
      id:uid(), description:it.description||'', hsn:it.hsn||'8481',
      qty:Number(it.qty||1), unit:it.unit||'Nos',
      unitPrice:it.unitPrice||'', amount:Number(it.amount||0),
      gstRate:18, gstAmount:Number(it.amount||0)*0.18,
      totalWithGst:Number(it.amount||0)*1.18
    }));
    const sub=invItems.reduce((s,i)=>s+Number(i.amount||0),0);
    const autoInv={
      id:uid(), quotationId:qId, reportId:q.reportId||'',
      invoiceNo:'INV-AUTO-'+q.quotNo.replace(/^Q-AUTO-/,''),
      invoiceDate:today(),
      dueDate:new Date(Date.now()+30*864e5).toISOString().slice(0,10),
      orderNo:q.orderNo||'',
      countryOfSupply:'India', placeOfSupply:'',
      customer:q.customer||'', site:q.site||'',
      contactPerson:q.contactPerson||'', designation:q.designation||'',
      clientPhone:q.clientPhone||'', clientEmail:q.clientEmail||'',
      clientGstin:q.clientGstin||'', clientPan:'',
      vendorCode:q.vendorCode||'',
      paymentTerms:q.paymentTerms||'30 days from invoice date',
      items:invItems, subtotal:sub, totalGst:sub*0.18, grandTotal:sub*1.18,
      notes:'Auto-drafted from accepted Quotation '+q.quotNo,
      status:'draft', autoGenerated:true,
      autoSource:'quotation_accepted', amcType:q.amcType||'',
      createdAt:new Date().toISOString()
    };
    db.invoices.push(autoInv);
  }

  sDB(db);CM();viewQ(qId);
}

function saveAutoInv(invId){
  const db=rDB();const idx=db.invoices.findIndex(x=>x.id===invId);if(idx<0){alert('Invoice not found');return;}
  const no=document.getElementById('inv-no').value.trim();if(!no){alert('Invoice Number required');return;}
  const items=(window._invItems||[]).map(it=>{
    const qty=Number(it.qty||0);const rate=Number(it.unitPrice||0);
    const amt=qty*rate;const gstRate=Number(it.gstRate||18);
    const gstAmt=amt*(gstRate/100);
    return{...it,qty,unitPrice:rate,amount:amt,gstRate,gstAmount:gstAmt,totalWithGst:amt+gstAmt};
  });
  const subtotal=items.reduce((s,it)=>s+it.amount,0);
  const totalGst=items.reduce((s,it)=>s+it.gstAmount,0);
  const grandTotal=subtotal+totalGst;
  const _place=document.getElementById('inv-place').value.trim();
  const _isHaryana=_place.toLowerCase().includes('haryana');
  const _gstType=_isHaryana?'cgst_sgst':'igst';
  const _cgst=_isHaryana?subtotal*0.09:0;
  const _sgst=_isHaryana?subtotal*0.09:0;
  const _igst=_isHaryana?0:subtotal*0.18;
  const _totalWithGst=subtotal+(_isHaryana?_cgst+_sgst:_igst);
  db.invoices[idx]={...db.invoices[idx],
    invoiceNo:no, invoiceDate:document.getElementById('inv-date').value,
    dueDate:document.getElementById('inv-due').value,
    orderNo:document.getElementById('inv-order').value.trim(),
    releaseOrderNo:document.getElementById('inv-rono')?.value.trim()||'',
    countryOfSupply:document.getElementById('inv-country').value.trim(),
    placeOfSupply:_place,
    customer:document.getElementById('inv-cust').value.trim(),
    site:document.getElementById('inv-site').value.trim(),
    contactPerson:document.getElementById('inv-contact').value.trim(),
    designation:document.getElementById('inv-desig').value.trim(),
    clientPhone:document.getElementById('inv-cphone').value.trim(),
    clientEmail:document.getElementById('inv-cemail').value.trim(),
    clientGstin:(document.getElementById('inv-cgstin').value.trim()).toUpperCase(),
    clientPan:(document.getElementById('inv-cpan').value.trim()).toUpperCase(),
    vendorCode:document.getElementById('inv-vcode').value.trim(),
    paymentTerms:document.getElementById('inv-pay').value.trim(),
    items,subtotal,totalGst,grandTotal,
    gstType:_gstType,cgst:_cgst,sgst:_sgst,igst:_igst,totalWithGst:_totalWithGst,
    gstAmount:totalGst,
    notes:document.getElementById('inv-notes').value.trim(),
    status:'pending', updatedAt:new Date().toISOString()
  };
  sDB(db);CM();pgInvoices();
}

function updateInvoice(id){
  const db=rDB();const inv=db.invoices.find(x=>x.id===id);if(!inv)return;
  const no=document.getElementById('inv-no').value.trim();if(!no){alert('Invoice Number required');return;}
  const items=(window._invItems||[]).map(it=>{
    const qty=Number(it.qty||0);const rate=Number(it.unitPrice||0);
    const amt=qty*rate;const gstRate=Number(it.gstRate||18);
    const gstAmt=amt*(gstRate/100);
    return{...it,qty,unitPrice:rate,amount:amt,gstRate,gstAmount:gstAmt,totalWithGst:amt+gstAmt};
  });
  const subtotal=items.reduce((s,it)=>s+it.amount,0);
  const totalGst=items.reduce((s,it)=>s+it.gstAmount,0);
  const grandTotal=subtotal+totalGst;
  inv.invoiceNo=no;
  inv.invoiceDate=document.getElementById('inv-date').value;
  inv.dueDate=document.getElementById('inv-due').value;
  inv.orderNo=document.getElementById('inv-order').value.trim();
  inv.releaseOrderNo=document.getElementById('inv-rono')?.value.trim()||'';
  inv.countryOfSupply=document.getElementById('inv-country').value.trim();
  const _up=document.getElementById('inv-place').value.trim();
  inv.placeOfSupply=_up;
  inv.customer=document.getElementById('inv-cust').value.trim();
  inv.site=document.getElementById('inv-site').value.trim();
  inv.contactPerson=document.getElementById('inv-contact').value.trim();
  inv.designation=document.getElementById('inv-desig').value.trim();
  inv.clientPhone=document.getElementById('inv-cphone').value.trim();
  inv.clientEmail=document.getElementById('inv-cemail').value.trim();
  inv.clientGstin=(document.getElementById('inv-cgstin').value.trim()).toUpperCase();
  inv.clientPan=(document.getElementById('inv-cpan').value.trim()).toUpperCase();
  inv.vendorCode=document.getElementById('inv-vcode').value.trim();
  inv.paymentTerms=document.getElementById('inv-pay').value.trim();
  inv.notes=document.getElementById('inv-notes').value.trim();
  inv.items=items;inv.subtotal=subtotal;inv.totalGst=totalGst;inv.grandTotal=grandTotal;
  const _uH=_up.toLowerCase().includes('haryana');
  inv.gstType=_uH?'cgst_sgst':'igst';
  inv.cgst=_uH?subtotal*0.09:0;inv.sgst=_uH?subtotal*0.09:0;inv.igst=_uH?0:subtotal*0.18;
  inv.totalWithGst=subtotal+(_uH?inv.cgst+inv.sgst:inv.igst);inv.gstAmount=totalGst;
  inv.updatedAt=new Date().toISOString();
  sDB(db);CM();viewInv(id);
}

function saveInvoice(quotId){
  const db=rDB();const q=quotId?db.quotations.find(x=>x.id===quotId):null;
  const no=document.getElementById('inv-no').value.trim();if(!no){alert('Invoice Number required');return;}
  const items=(window._invItems||(q?q.items:[])||[]).map(it=>{
    const qty=Number(it.qty||0);const rate=Number(it.unitPrice||0);
    const amt=qty*rate;const gstRate=Number(it.gstRate||18);
    const gstAmt=amt*(gstRate/100);
    return{...it,qty,unitPrice:rate,amount:amt,gstRate,gstAmount:gstAmt,totalWithGst:amt+gstAmt};
  });
  const subtotal=items.reduce((s,it)=>s+it.amount,0);
  const totalGst=items.reduce((s,it)=>s+it.gstAmount,0);
  const grandTotal=subtotal+totalGst;
  const _plc=document.getElementById('inv-place').value.trim();
  const _isH=_plc.toLowerCase().includes('haryana');
  const _gT=_isH?'cgst_sgst':'igst';
  const _cg=_isH?subtotal*0.09:0;const _sg=_isH?subtotal*0.09:0;const _ig=_isH?0:subtotal*0.18;
  const _twg=subtotal+(_isH?_cg+_sg:_ig);
  const inv={id:uid(),quotationId:quotId,invoiceNo:no,
    invoiceDate:document.getElementById('inv-date').value,
    dueDate:document.getElementById('inv-due').value,
    orderNo:document.getElementById('inv-order').value.trim(),
    releaseOrderNo:document.getElementById('inv-rono')?.value.trim()||'',
    countryOfSupply:document.getElementById('inv-country').value.trim(),
    placeOfSupply:_plc,
    customer:document.getElementById('inv-cust').value.trim()||(q?q.customer:''),
    site:document.getElementById('inv-site').value.trim(),
    contactPerson:document.getElementById('inv-contact').value.trim(),
    designation:document.getElementById('inv-desig').value.trim(),
    clientPhone:document.getElementById('inv-cphone').value.trim(),
    clientEmail:document.getElementById('inv-cemail').value.trim(),
    clientGstin:(document.getElementById('inv-cgstin').value.trim()).toUpperCase(),
    clientPan:(document.getElementById('inv-cpan').value.trim()).toUpperCase(),
    vendorCode:document.getElementById('inv-vcode').value.trim(),
    paymentTerms:document.getElementById('inv-pay').value.trim(),
    items,subtotal,totalGst,grandTotal,
    gstType:_gT,cgst:_cg,sgst:_sg,igst:_ig,totalWithGst:_twg,gstAmount:totalGst,
    notes:document.getElementById('inv-notes').value.trim(),
    status:'pending',createdAt:new Date().toISOString()};
  if(q)q.status='invoiced';
  db.invoices.push(inv);sDB(db);CM();viewInv(inv.id);
}

// ===== PAYMENTS =====
function pgPayments(){
  const db=rDB();
  const rows=db.payments.slice().reverse().map(p=>{
    const inv=db.invoices.find(i=>i.id===p.invoiceId);
    return`<tr>
      <td>${fmt(p.date)}</td><td class="bold">${inv?inv.invoiceNo:'-'}</td>
      <td>${inv?.customer||'-'}</td><td class="txt-good bold">${fmtMoney(p.amount)}</td>
      <td>${p.mode||'-'}</td><td class="txt-warn">${fmtMoney(p.tds)}</td>
      <td class="txt-good bold">${fmtMoney(Number(p.amount||0)-Number(p.tds||0))}</td>
      <td>${p.ref||'-'}</td><td>${p.notes||'-'}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="9" class="text-center txt-fg2" style="padding:32px">No payments yet</td></tr>`;
  // Summary
  const totalAmt=db.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalTDS=db.payments.reduce((s,p)=>s+Number(p.tds||0),0);
  document.getElementById('content').innerHTML=`
    <div class="stats-grid" style="max-width:600px">
      <div class="stat-card"><div class="stat-num txt-good">${fmtMoney(totalAmt)}</div><div class="stat-lbl">Total Received</div></div>
      <div class="stat-card"><div class="stat-num txt-warn">${fmtMoney(totalTDS)}</div><div class="stat-lbl">Total TDS</div></div>
      <div class="stat-card"><div class="stat-num">${fmtMoney(totalAmt-totalTDS)}</div><div class="stat-lbl">Net Received</div></div>
    </div>
    <div class="card" style="padding:0"><div class="tbl-wrap"><table>
    <tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Amount</th><th>Mode</th><th>TDS</th><th>Net</th><th>Ref</th><th>Notes</th></tr>
    ${rows}</table></div></div>`;
}

function openAddPayment(invoiceId){
  const db=rDB();const inv=db.invoices.find(i=>i.id===invoiceId);
  const pays=db.payments.filter(p=>p.invoiceId===invoiceId);
  const received=pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const bal=Number(inv?.totalWithGst||0)-received;
  SM(`<div class="mhd"><h3>💰 Record Payment</h3><button class="btn btn-s btn-xs" onclick="CM()">✕</button></div>
  <div class="mbody">
    ${inv?`<div class="alert alert-i">Invoice: <strong>${inv.invoiceNo}</strong> | Total: ${fmtMoney(inv.totalWithGst)} | Balance: <strong>${fmtMoney(bal)}</strong></div>`:''}
    <div class="form-grid">
      <div class="form-group"><label>Payment Date *</label><input id="pay-date" type="date" value="${today()}"></div>

function savePayment(invoiceId){
  const db=rDB();
  const amt=Number(document.getElementById('pay-amt').value||0);
  if(!amt){alert('Enter payment amount');return;}
  const pay={id:uid(),invoiceId,date:document.getElementById('pay-date').value,
    amount:amt,mode:document.getElementById('pay-mode').value,
    tds:Number(document.getElementById('pay-tds').value||0),
    ref:document.getElementById('pay-ref').value.trim(),
    notes:document.getElementById('pay-notes').value.trim()};
  db.payments.push(pay);
  // update invoice status
  const inv=db.invoices.find(i=>i.id===invoiceId);
  if(inv){
    const allPays=db.payments.filter(p=>p.invoiceId===invoiceId);
    const received=allPays.reduce((s,p)=>s+Number(p.amount||0),0);
    inv.status=received>=Number(inv.totalWithGst||0)-0.01?'paid':'partial';
  }
  sDB(db);CM();pgPayments();
}

window.addEventListener('DOMContentLoaded',async()=>{
  try{const t=localStorage.getItem('sv3_theme');if(t!==null)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  document.getElementById('root').innerHTML='<div style="padding:80px 20px;text-align:center;font-size:15px">⏳ Loading data from cloud…</div>';
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const res=await r.json();
    CLOUD=true;
    if(res.data){
      _ver=res.version;
      const json=JSON.stringify(normDB(res.data));
      _lastSynced=json; localStorage.setItem(KEY,json);
    } else {
      // Cloud is empty: upload this computer's existing data (first-time migration)
      const local=localStorage.getItem(KEY);
      if(local){ _lastSynced=''; sDB(normDB(JSON.parse(local))); }
      else rDB(); // creates default data and uploads it
    }
    setInterval(cloudPull,10000);  // check for other users' changes every 10 seconds
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) cloudPull(); });
  }catch(e){
    console.warn('Cloud not available',e); CLOUD=false;
  }
  startApp();
});

function openBlankChallan(){
  _dcItems=[{id:uid(),description:'',hsn:'',qty:1,unit:'Nos'}];
  _showChallanForm(null,null);
}

function genChallan(sourceId,sourceType){
  // sourceType: 'quotation' or 'invoice'
  const db=rDB();
  let items=[],customer='',site='',contactPerson='',designation='',clientPhone='',clientGstin='',vendorCode='',orderNo='';
  if(sourceType==='quotation'){
    const q=db.quotations.find(x=>x.id===sourceId);if(!q)return;
    items=(q.items||[]).map(it=>({id:uid(),description:it.description||'',hsn:it.hsn||'',qty:Number(it.qty||1),unit:it.unit||'Nos'}));
    customer=q.customer||'';site=q.site||'';contactPerson=q.contactPerson||'';designation=q.designation||'';
    clientPhone=q.clientPhone||'';clientGstin=q.clientGstin||'';vendorCode=q.vendorCode||'';orderNo=q.orderNo||'';
  }else if(sourceType==='invoice'){
    const inv=db.invoices.find(x=>x.id===sourceId);if(!inv)return;
    items=(inv.items||[]).map(it=>({id:uid(),description:it.description||'',hsn:it.hsn||'',qty:Number(it.qty||1),unit:it.unit||'Nos'}));
    customer=inv.customer||'';site=inv.site||'';contactPerson=inv.contactPerson||'';designation=inv.designation||'';
    clientPhone=inv.clientPhone||'';clientGstin=inv.clientGstin||'';vendorCode=inv.vendorCode||'';orderNo=inv.orderNo||'';
  }
  if(!items.length)items=[{id:uid(),description:'',hsn:'',qty:1,unit:'Nos'}];
  _dcItems=items;
  _showChallanForm({customer,site,contactPerson,designation,clientPhone,clientGstin,vendorCode,orderNo},sourceId+':'+sourceType);
}

function saveChallan(){

  const cust=document.getElementById('dc-cust').value.trim();if(!cust){alert('Customer name required');return;}
  const challan={
    id:uid(),challanNo:no,challanDate:document.getElementById('dc-date').value,
    purpose:document.getElementById('dc-purpose').value,
    status:document.getElementById('dc-status').value,
    refNo:document.getElementById('dc-ref').value.trim(),
    vehicleNo:document.getElementById('dc-vehicle').value.trim(),
    transportMode:document.getElementById('dc-tmode').value,
    transporter:document.getElementById('dc-transporter').value.trim(),
    lrNo:document.getElementById('dc-lr').value.trim(),
    driverName:document.getElementById('dc-driver').value.trim(),
    customer:cust,site:document.getElementById('dc-site').value.trim(),
    contactPerson:document.getElementById('dc-contact').value.trim(),
    designation:document.getElementById('dc-desig').value.trim(),
    clientPhone:document.getElementById('dc-phone').value.trim(),
    clientGstin:(document.getElementById('dc-cgstin').value.trim()).toUpperCase(),
    vendorCode:document.getElementById('dc-vcode').value.trim(),
    remarks:document.getElementById('dc-remarks').value.trim(),
    linkedRef:document.getElementById('dc-linked').value,
    items:_dcItems.map(it=>({...it,qty:Number(it.qty||1)})),
    createdAt:new Date().toISOString()
  };
  db.challans.push(challan);sDB(db);CM();viewChallan(challan.id);
  // Auto-prompt invoice after challan save
  if(CU.role==='admin'||CU.role==='finance'){
    const _lq=challan.linkedRef?rDB().quotations.find(x=>x.id===challan.linkedRef):null;
    if(_lq&&_lq.status!=='invoiced'){
      setTimeout(()=>{
        SM(`<div class="mhd"><h3>🧾 Invoice Generate Karein?</h3><button class="btn btn-s btn-xs" onclick="CM()">✕</button></div>

            <button class="btn btn-s" onclick="CM()">Baad Mein Karunga</button>

      </div>
      <div>

function editChallan(id){

  _dcItems=(c.items||[]).map(it=>({...it}));
  SM(`<div class="mhd"><h3>✏️ Edit Challan – ${esc(c.challanNo)}</h3><button class="btn btn-s btn-xs" onclick="CM()">✕</button></div>
  <div class="mbody">
    <div class="bold mb-8" style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.5px">📋 Challan Details</div>
    <div class="form-grid">
      <div class="form-group"><label>Challan No *</label><input id="dc-no" value="${esc(c.challanNo)}"></div>
      <div class="form-group"><label>Date</label><input id="dc-date" type="date" value="${c.challanDate||''}"></div>
      <div class="form-group"><label>Purpose</label><select id="dc-purpose">
        ${['For Sale','For Job Work','For Return','For Exhibition / Fairs','For Own Use','For Repairs / Maintenance','Others'].map(o=>`<option ${c.purpose===o?'selected':''}>${o}</option>`).join('')}
      </select></div>
      <div class="form-group"><label>Status</label><select id="dc-status">
        <option value="draft" ${c.status==='draft'?'selected':''}>Draft</option>
        <option value="dispatched" ${c.status==='dispatched'?'selected':''}>Dispatched</option>
        <option value="delivered" ${c.status==='delivered'?'selected':''}>Delivered</option>
      </select></div>
      <div class="form-group"><label>PO / Ref No</label><input id="dc-ref" value="${esc(c.refNo||'')}"></div>
      <div class="form-group"><label>Vehicle No</label><input id="dc-vehicle" value="${esc(c.vehicleNo||'')}"></div>
    </div>
    <div class="bold mb-8" style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.5px">🚚 Transport Details</div>
    <div class="form-grid">
      <div class="form-group"><label>Transport Mode</label><select id="dc-tmode">
        ${['Road','Rail','Air','Sea','Hand Delivery'].map(o=>`<option ${c.transportMode===o?'selected':''}>${o}</option>`).join('')}
      </select></div>
      <div class="form-group"><label>Transporter Name</label><input id="dc-transporter" value="${esc(c.transporter||'')}"></div>
      <div class="form-group"><label>LR No / Docket No</label><input id="dc-lr" value="${esc(c.lrNo||'')}"></div>
      <div class="form-group"><label>Driver Name</label><input id="dc-driver" value="${esc(c.driverName||'')}"></div>
    </div>
    <div class="sep"></div>
    <div class="bold mb-8" style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.5px">🏢 Consignee</div>
    <div class="form-grid">
      <div class="form-group"><label>Customer / Company *</label><input id="dc-cust" value="${esc(c.customer||'')}"></div>
      <div class="form-group"><label>Site / Address</label><input id="dc-site" value="${esc(c.site||'')}"></div>
      <div class="form-group"><label>Contact Person</label><input id="dc-contact" value="${esc(c.contactPerson||'')}"></div>
      <div class="form-group"><label>Designation</label><input id="dc-desig" value="${esc(c.designation||'')}"></div>
      <div class="form-group"><label>Phone</label><input id="dc-phone" value="${esc(c.clientPhone||'')}"></div>
      <div class="form-group"><label>GSTIN</label><input id="dc-cgstin" value="${esc(c.clientGstin||'')}" style="text-transform:uppercase"></div>
      <div class="form-group"><label>Vendor Code</label><input id="dc-vcode" value="${esc(c.vendorCode||'')}"></div>
    </div>
    <div class="sep"></div>
    <div class="flex items-center gap-8 mb-8">
      <div class="bold" style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.5px">📦 Items</div>
      <button class="btn btn-s btn-sm" onclick="addDcItem()">+ Add Row</button>
    </div>
    <div id="dc-items-wrap" style="overflow-x:auto"></div>
    <div class="sep"></div>
    <div class="form-grid">
      <div class="form-group full"><label>Remarks</label><textarea id="dc-remarks" rows="2">${esc(c.remarks||'')}</textarea></div>
    </div>
  </div>
  <input type="hidden" id="dc-linked" value="${esc(c.linkedRef||'')}">
  <div class="mfoot"><button class="btn btn-s" onclick="CM()">Cancel</button><button class="btn btn-p" onclick="updateChallan('${id}')">Save Changes</button></div>`,'wide');

}

function updateChallan(id){
  const db=rDB();const c=db.challans.find(x=>x.id===id);if(!c)return;
  const no=document.getElementById('dc-no').value.trim();if(!no){alert('Challan Number required');return;}
  c.challanNo=no;c.challanDate=document.getElementById('dc-date').value;
  c.purpose=document.getElementById('dc-purpose').value;c.status=document.getElementById('dc-status').value;
  c.refNo=document.getElementById('dc-ref').value.trim();c.vehicleNo=document.getElementById('dc-vehicle').value.trim();
  c.transportMode=document.getElementById('dc-tmode').value;c.transporter=document.getElementById('dc-transporter').value.trim();
  c.lrNo=document.getElementById('dc-lr').value.trim();c.driverName=document.getElementById('dc-driver').value.trim();
  c.customer=document.getElementById('dc-cust').value.trim();c.site=document.getElementById('dc-site').value.trim();
  c.contactPerson=document.getElementById('dc-contact').value.trim();c.designation=document.getElementById('dc-desig').value.trim();
  c.clientPhone=document.getElementById('dc-phone').value.trim();
  c.clientGstin=(document.getElementById('dc-cgstin').value.trim()).toUpperCase();
  c.vendorCode=document.getElementById('dc-vcode').value.trim();
  c.remarks=document.getElementById('dc-remarks').value.trim();
  c.items=_dcItems.map(it=>({...it,qty:Number(it.qty||1)}));
  c.updatedAt=new Date().toISOString();
  sDB(db);CM();viewChallan(id);
}
